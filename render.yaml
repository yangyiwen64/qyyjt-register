services:
  - type: web
    name: qyyjt-register
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt && python -m playwright install chromium
    startCommand: node server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_PATH
        value: python3
