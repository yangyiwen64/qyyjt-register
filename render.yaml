services:
  - type: web
    name: qyyjt-register
    runtime: node
    plan: free
    buildCommand: |
      echo "=== Installing Node deps ===" && \
      npm install && \
      npm run build && \
      echo "=== Installing Python deps ===" && \
      python3 -m pip install --user opencv-python numpy pillow requests scipy && \
      echo "=== Installing Playwright ===" && \
      python3 -m pip install --user playwright && \
      python3 -m playwright install chromium && \
      echo "=== Build complete ==="
    startCommand: node server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_PATH
        value: python3
